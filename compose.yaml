name: nexusai-phase3-stripe

services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: nexusai
      POSTGRES_USER: nexusai
      POSTGRES_PASSWORD: nexusai
    ports:
      - "127.0.0.1:56432:5432"
    volumes:
      - nexusai_phase3_stripe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai -d nexusai"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nexusai_phase3_stripe

  postgres-test:
    profiles: ["test"]
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: nexusai_test
      POSTGRES_USER: nexusai_test
      POSTGRES_PASSWORD: nexusai_test
    ports:
      - "127.0.0.1:56433:5432"
    volumes:
      - nexusai_phase3_stripe_test_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexusai_test -d nexusai_test"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nexusai_phase3_stripe_test

  backend:
    build:
      context: ./backend
    environment:
      NEXUSAI_DATABASE_URL: postgresql+psycopg://nexusai:nexusai@postgres:5432/nexusai
      NEXUSAI_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      NEXUSAI_TRUSTED_HOSTS: localhost,127.0.0.1,backend
      NEXUSAI_COOKIE_SECURE: "false"
      NEXUSAI_STRIPE_ENABLED: ${NEXUSAI_STRIPE_ENABLED:-false}
      NEXUSAI_STRIPE_SECRET_KEY: ${NEXUSAI_STRIPE_SECRET_KEY:-}
      NEXUSAI_STRIPE_WEBHOOK_SECRET: ${NEXUSAI_STRIPE_WEBHOOK_SECRET:-}
      NEXUSAI_STRIPE_API_VERSION: ${NEXUSAI_STRIPE_API_VERSION:-2026-11-18.endive}
      NEXUSAI_FRONTEND_BASE_URL: ${NEXUSAI_FRONTEND_BASE_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8000"
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - nexusai_phase3_stripe

networks:
  nexusai_phase3_stripe:
    name: nexusai_phase3_stripe
  nexusai_phase3_stripe_test:
    name: nexusai_phase3_stripe_test

volumes:
  nexusai_phase3_stripe_postgres:
    name: nexusai_phase3_stripe_postgres
  nexusai_phase3_stripe_test_postgres:
    name: nexusai_phase3_stripe_test_postgres
