services:
  backend:
    environment:
      NEXUSAI_DATABASE_URL: postgresql+psycopg://nexusai_test:nexusai_test@postgres-test:5432/nexusai_test
      NEXUSAI_ALLOWED_ORIGINS: http://127.0.0.1:8081,http://localhost:8081
      NEXUSAI_TRUSTED_HOSTS: localhost,127.0.0.1,backend
      NEXUSAI_STRIPE_ENABLED: "false"
      NEXUSAI_STRIPE_SECRET_KEY: "rkcs_test_e2e_placeholder"
      NEXUSAI_STRIPE_WEBHOOK_SECRET: "whsec_e2e_placeholder"
    ports:
      - "127.0.0.1:8101:8000"
    networks:
      - nexusai_phase3_stripe
      - nexusai_phase3_stripe_test
    depends_on:
      postgres-test:
        condition: service_healthy
